name: Core and real IO tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" zarr==3.3.0
      - run: python -m pytest -q
      # Official-metric extras are tested on the pinned Vast environment.
      # Missing optional dependencies are reported as skips, never parity passes.

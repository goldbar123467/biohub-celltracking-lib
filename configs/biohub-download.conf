[program:biohub-download]
directory=/workspace/biohub-cell-tracking
command=/workspace/biohub-cell-tracking/.venv/bin/python -u /workspace/biohub-cell-tracking/scripts/download_data.py
autostart=false
autorestart=false
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/biohub-cell-tracking/reports/download.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",KAGGLEHUB_CACHE="/workspace/biohub-cell-tracking/cache/kagglehub"
